# Command & Conquer Generals Zero Hour: settings for the shared build
# (common/native-mac/mk/game.mk) and the shared scripts. KEY=value lines,
# values may contain spaces.
GAME_NAME=GeneralsZH
GAME_EXE=game.dat
# The EA app copy (patch 1.04, built 2005-03-10). The fixes in srw/ are for this exe only.
GAME_EXE_SHA256=9f615bfd3910ca174d0f044cdaee8c6fa26e5fdc28b89cc0e61c52943d857df7
GAME_LLASM=GeneralsZH
# The exe is in the Wine game folder (the Wine-only files); the data is in Original Game Files.
GAME_DIR_DEFAULT=Games/Command and Conquer Generals Zero Hour/other-versions/wine-11-athei/wineprefix/drive_c/EA Games/Command and Conquer Generals Zero Hour
APP_NAME=Command & Conquer Generals Zero Hour (Native)
APP_ICON_SOURCE=GeneralsZH.ico
# Big .text: many plain numbers are in its address range (see gen_relocs.py)
GEN_RELOCS_OPTIONS=--strict-data-code
# Direct3D 8 on DXVK: the DXVK source of the community port build (its native
# DirectX headers; the DXVK libraries come from the same build)
DXVK_INCLUDE=../../open-source-port/GeneralsX/build/macos-vulkan/_deps/dxvk-src-generalsx
# Bink video on FFmpeg (common/native-mac/runtime/bink)
USE_BINK=1
# App bundle (common/native-mac/macos/make-bundle.sh): FFmpeg for Bink, and the
# DXVK, Vulkan loader and MoltenVK libraries of the community port's app
EXTRA_DYLIBS=libavformat.62.dylib libavcodec.62.dylib libavutil.60.dylib libswscale.9.dylib libswresample.6.dylib
DXVK_LIB_DIR=../../open-source-port/build/Command & Conquer Generals Zero Hour.app/Contents/Resources/lib
