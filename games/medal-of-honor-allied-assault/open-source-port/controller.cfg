// PS4 controller (DUALSHOCK 4) for Medal of Honor Allied Assault, Spearhead
// and Breakthrough. The game runs this file at each start. The keyboard and
// mouse keys stay as they are. Change a button here, for example:
// bind PAD0_X "reload"
//
// Sticks: left stick moves, right stick turns and aims. The analog sticks
// need "+set in_joystick 1 +set in_joystickUseAnalog 1" (the app sets them).
bind PAD0_LEFTSTICK_UP "+forward"
bind PAD0_LEFTSTICK_DOWN "+back"
bind PAD0_LEFTSTICK_LEFT "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"
bind PAD0_RIGHTSTICK_LEFT "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_RIGHTSTICK_UP "+lookup"
bind PAD0_RIGHTSTICK_DOWN "+lookdown"
// Turn and aim speed of the right stick (larger is faster). The turn speed
// is this value x 32767 degrees per second at full stick, and it grows in a
// straight line from the dead zone. The engine default (0.022, about 720
// degrees per second) was much too fast. Our fork of the engine also scales
// the stick turn by the zoom (as for the mouse: the view angle / 75, about
// 0.86 with no zoom at cg_fov 80, much less in a rifle scope). -0.0064 gives
// about 180 degrees per second for left and right with no zoom, 0.0047 about
// 130 for up and down. Keep the sign.
set j_yaw "-0.0064"
set j_pitch "0.0047"
// Response curve of the right stick (our fork of the engine): the stick
// value to this power. With 3, a half push turns at an eighth of the full
// speed, so small moves are slow and exact; a full push stays as above.
// 1 is a straight line. 2 was not slow enough for small moves (2026-10-29).
set j_curve "3"
// Aim mode, hold L2 (our fork): the view zooms in from cg_fov (80) to
// cg_aimFov in cg_aimTime milliseconds (40: about 2 times), and the stick
// turns slower by cg_aimSensitivity, on top of the zoom (which slows it
// about 0.5 times at 40). A weapon with a scope opens the scope in place of
// this zoom, and there cg_scopeSensitivity slows the turn more, on top of
// the scope zoom. 55 and 0.6 were too weak to notice, and 0.5 was still too
// fast (2026-10-29).
set cg_aimFov "40"
set cg_aimSensitivity "0.3"
set cg_scopeSensitivity "0.5"
set cg_aimTime "150"
// Dead zone of L2 and R2: a trigger counts as pressed above this part of
// its travel. Our fork of the engine adds this setting (joy_threshold is
// for the sticks). One PS4 controller here reads R2 at 47 to 63 percent at
// rest (L2 at 0), so a lower value fires the gun with no press.
set joy_triggerThreshold "0.8"

bind PAD0_RIGHTTRIGGER "+attackprimary"   // R2: fire
bind PAD0_LEFTTRIGGER "+aim"              // L2: aim (hold), or the scope of a sniper rifle
bind PAD0_A "+moveup"                     // Cross: jump
bind PAD0_B "+movedown"                   // Circle: crouch
bind PAD0_X "reload"                      // Square: reload
bind PAD0_Y "weapnext"                    // Triangle: next weapon
bind PAD0_LEFTSHOULDER "+leanleft"        // L1: lean left (hold)
bind PAD0_RIGHTSHOULDER "+leanright"      // R1: lean right (hold)
bind PAD0_LEFTSTICK_CLICK "+speed"        // L3: walk (hold)
bind PAD0_RIGHTSTICK_CLICK "+use"         // R3: use (doors, switches)
bind PAD0_DPAD_UP "useweaponclass rifle"
bind PAD0_DPAD_DOWN "useweaponclass smg"
bind PAD0_DPAD_LEFT "useweaponclass grenade"  // D-pad left: grenades
bind PAD0_DPAD_RIGHT "+attacksecondary"   // D-pad right: second fire mode (rifle butt, grenade throw, scope)
bind PAD0_TOUCHPAD "toggleitem"           // touchpad click: health, binoculars
bind PAD0_BACK "+scores"                  // SHARE: objectives and scores
bind PAD0_START "togglemenu"              // OPTIONS: menu
