// Mac keys for Medal of Honor Allied Assault, Spearhead and Breakthrough.
// The game runs this file at each start.
//
// Full screen or window: press Cmd+Enter or Option+Enter. The engine has
// these keys (CL_KeyEvent: Alt+Enter, and Cmd+Enter in our fork, set
// r_fullscreen at once, and the window changes with no restart).
//
// An earlier version of this file made Cmd+Enter do "toggle r_fullscreen;
// vid_restart". It worked only once: after vid_restart the game got no
// more Cmd key-down events (only key-up events), so the second Cmd+Enter
// did nothing. The player config keeps binds, so remove those binds here.
unbind COMMAND
unbind ENTER
unbind KP_ENTER
