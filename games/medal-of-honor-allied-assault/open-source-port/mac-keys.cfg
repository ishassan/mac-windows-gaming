// Mac keys for Medal of Honor Allied Assault, Spearhead and Breakthrough.
// The game runs this file at each start.
//
// Cmd+Enter: switch between full screen and a window. While Cmd is held,
// Enter (and keypad Enter) run fullscreen_toggle; when Cmd is released,
// Enter is free again. The game has no other use for Enter outside the
// menus. In the menus the keys go to the menu, so use Cmd+Enter in the game.
alias fullscreen_toggle "toggle r_fullscreen; vid_restart"
alias +cmd_keys "bind ENTER fullscreen_toggle; bind KP_ENTER fullscreen_toggle"
alias -cmd_keys "unbind ENTER; unbind KP_ENTER"
bind COMMAND "+cmd_keys"
