// PS4 controller, Allied Assault only: the app runs this file after
// controller.cfg. Allied Assault has no lean in single player (the engine
// sets the lean angle to 0, as in the original game), so L1 and R1 get
// other actions here. Spearhead and Breakthrough keep lean on L1 and R1.
bind PAD0_LEFTSHOULDER "useweaponclass grenade"  // L1: grenades
bind PAD0_RIGHTSHOULDER "+attacksecondary" // R1: second fire mode (rifle butt hit, grenade throw, scope)
