# Build environment for all native ports in this repository.
# Create:   conda env create -f environment.yml
# Then:     . common/native-mac/tools/env.sh && common/native-mac/tools/install-ldc.sh
# The D compiler (LDC) is not on conda-forge. common/native-mac/tools/install-ldc.sh puts the
# official LDC release inside this environment's folder.
name: mac-windows-gaming
channels:
  - conda-forge
dependencies:
  - python=3.12
  - capstone=5.0     # x86 disassembler (relocation finder)
  - pefile           # PE file reader
  - scons=4.11       # builds SRW and the game
  - llvm-tools=23    # llc/opt: compile llasm output to arm64
  - sdl2=2.32        # window, input, audio for the runtime layer
  - freetype=2.13    # GDI text: glyphs with the font hints, as on Windows
  - python-unicorn=2.1  # x86 emulator: identify C runtime functions by running them
  - ffmpeg=8.0=lgpl*    # Bink video (libavcodec) for the Generals Zero Hour recompile
  # Command & Conquer Generals Zero Hour (our fork of the GeneralsX port, CMake build)
  - cmake=4.4
  - ninja=1.13
  - meson=1.12        # builds DXVK
  - pkg-config
  - glslang=16        # DXVK shader compiler (glslangValidator)
  - libvulkan-loader
  - libvulkan-headers
  - moltenvk=1.4      # Vulkan on Metal
